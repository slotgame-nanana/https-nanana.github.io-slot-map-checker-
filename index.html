$('newMapBtn').onclick=()=>{const name=prompt('新しい島図の名前を入力してください','');if(!name||!name.trim())return;const id='map_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);const m={id,name:name.trim(),cells:CELLS.map(c=>[...c])};/* 新規島図は配置と台番号のみ引き継ぎ、記録は一切コピーしない */maps.push(m);storeMaps();enterMap(m)};
$('existingBtn').onclick=()=>{const list=$('mapList');list.innerHTML='';maps.forEach(m=>{const row=document.createElement('div');row.style.cssText='display:flex;gap:8px;margin:8px 0';const b=document.createElement('button');b.textContent=m.name+'（'+m.cells.length+'台）';b.style.cssText='flex:1;border:0;border-radius:10px;padding:13px;background:white;color:#163552;font-weight:700';b.onclick=()=>enterMap(m);row.append(b);if(m.id!=='original'){const del=document.createElement('button');del.textContent='削除';del.style.cssText='border:0;border-radius:10px;padding:8px;background:#a82e40;color:white';del.onclick=()=>{if(!confirm(m.name+'を削除しますか？'))return;maps=maps.filter(x=>x.id!==m.id);storeMaps();$('existingBtn').click()};row.append(del)}list.append(row)});list.classList.remove('hidden')};
$('editBtn').onclick=()=>{editMode=!editMode;$('editBtn').textContent=editMode?'編集完了':'編集';if(editMode)alert('空白をタップすると台を追加、既存の台をタップすると削除できます。')};$('homeBtn').onclick=()=>{editMode=false;$('startScreen').classList.remove('hide')};paint();setScale(Math.min(innerWidth/927,innerHeight/1536));window.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',()=>setScale(Math.min(innerWidth/927,innerHeight/1536)));
</script></body></html>
